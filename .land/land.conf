# scripts/land.conf: this repository's landing configuration. Data, not code: LAND_KEY=value per line. Every key: the README of the pinned lander (vbm-land).
# Stripped to the minimum: a commit that passes Tier 1 lands with no approval, no hash, no size refusal. Nothing runs after the push.
LAND_BASE=main
LAND_TEST_CMD=mise exec -- scripts/tier1.sh
LAND_CONVENTIONAL=1
# The lander's own files: a change to them never counts as a fix for a red main.
LAND_STEP_TIMEOUT=1800
